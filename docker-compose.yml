version: "3.9"


services:
  postgres:
    image: postgres:15
    container_name: postgres_sentinel
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
     - postgres_sentinel:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5


  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: fast_api
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - fast_api_instance:/evolution/instances
    env_file:
      - .env  
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on: 
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: streamlit_dashboard
    restart: always 
    ports:
      - "8501:8501"
    volumes:
      - streamlit_instance:/streamlit/instances
    env_file:
      - .env  
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on: 
      postgres:
        condition: service_healthy
volumes:
  postgres_sentinel:
  fast_api_instance:
  streamlit_instance:
